name: Refresh social preview image
on:
  push:
    branches: [main]
    paths:
      - scripts/build_social_preview.py
      - favicon.svg
      - .github/workflows/build-social-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter
          python -m pip install Pillow CairoSVG
      - name: Generate image from approved logo
        run: python scripts/build_social_preview.py
      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh OG image to use approved SVG logo and aligned periods"
            git push
          fi
